<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>IB Fresh Fish – Development Login Setup</title>
    <style>
      :root { color-scheme: light; font-family: Inter, system-ui, sans-serif; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f0f9ff; color: #0f172a; }
      main { width: min(420px, calc(100vw - 40px)); background: white; padding: 32px; border-radius: 18px; box-shadow: 0 18px 50px rgb(15 23 42 / 12%); }
      h1 { margin: 0 0 8px; font-size: 24px; }
      p { color: #475569; line-height: 1.5; }
      label { display: block; margin: 18px 0 6px; font-weight: 600; }
      input { box-sizing: border-box; width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 9px; font: inherit; }
      button { width: 100%; margin-top: 18px; padding: 12px; border: 0; border-radius: 9px; background: #0284c7; color: white; font: inherit; font-weight: 700; cursor: pointer; }
      button:disabled { opacity: .55; cursor: wait; }
      .message { padding: 12px; border-radius: 9px; background: #f1f5f9; }
      .error { background: #fef2f2; color: #b91c1c; }
      .success { background: #ecfdf5; color: #047857; }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <main>
      <h1>Development account setup</h1>
      <p id="status" class="message">Validating your Supabase link…</p>
      <form id="password-form" hidden>
        <label for="password">New development password</label>
        <input id="password" type="password" minlength="10" autocomplete="new-password" required />
        <label for="confirmation">Confirm password</label>
        <input id="confirmation" type="password" minlength="10" autocomplete="new-password" required />
        <button type="submit">Save development password</button>
      </form>
    </main>
    <script src="/supabase.js"></script>
    <script src="/config.js"></script>
    <script>
      const status = document.getElementById('status');
      const form = document.getElementById('password-form');
      const button = form.querySelector('button');
      const query = new URLSearchParams(location.search);

      function show(message, kind) {
        status.textContent = message;
        status.className = `message ${kind || ''}`;
      }

      async function initialize() {
        const linkError = query.get('error_description');
        if (linkError) {
          show(decodeURIComponent(linkError.replace(/\+/g, ' ')), 'error');
          return;
        }

        const client = window.supabase.createClient(
          window.DEV_AUTH_CONFIG.url,
          window.DEV_AUTH_CONFIG.publishableKey,
          { auth: { detectSessionInUrl: true, persistSession: false } },
        );

        const { data, error } = await client.auth.getSession();
        if (error || !data.session) {
          show(error?.message || 'This link is invalid or expired. Request a fresh development recovery email.', 'error');
          return;
        }

        show('Link verified. Choose a password used only for the development app.');
        form.hidden = false;

        form.addEventListener('submit', async event => {
          event.preventDefault();
          const password = document.getElementById('password').value;
          const confirmation = document.getElementById('confirmation').value;

          if (password !== confirmation) {
            show('The passwords do not match.', 'error');
            return;
          }

          button.disabled = true;
          const { error: updateError } = await client.auth.updateUser({ password });
          button.disabled = false;

          if (updateError) {
            show(updateError.message, 'error');
            return;
          }

          form.hidden = true;
          show('Password saved. You can now sign in to the Expo app with this email and password.', 'success');
          history.replaceState({}, document.title, '/');
        });
      }

      initialize();
    </script>
  </body>
</html>
